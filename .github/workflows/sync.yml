name: sync

# Refresh skills, contract and examples from the live tektolo.com once a day.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync.py
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "nothing to commit"; exit 0; fi
          git config user.name "tektolo-sync"
          git config user.email "hello@tektolo.com"
          git add -A
          git commit -m "sync from tektolo.com $(date -u +%Y-%m-%d)"
          git push
